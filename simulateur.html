  indep: 'مشروعك مكتب دراسات مستقل، لسنا تابعين لـ NESDA. معلوماتك تُستعمل فقط باش نتواصلو معاك.', espace: 'فضاء صاحب المشروع'},
fr: {h1: 'Calculez le financement <em>NESDA</em> de votre projet en 30 secondes', sub: 'Combien de votre poche ? Combien prête la NESDA ? Gratuit, sans inscription.',

  fraisT: 'Autres frais de démarrage', fNot: 'Notaire (nantissement du matériel)', fAdm: 'Frais administratifs', fLoy: n => `Loyer (${n} mois)`, fLoyN: 'dont prêt loyer NESDA', fAss: 'Assurance', fDet: 'Détail',
  pocheK: 'Total à prévoir de votre poche', pocheS: 'Pas tout aujourd\'hui : il s\'étale sur les étapes, et l\'apport n\'arrive qu\'après l\'accord de la commission et de la banque, soit au moins 2 à 3 mois. Les frais de notaire, d\'huissier et administratifs sont estimatifs.', tlEst: 'estimation', tlT: 'Quand payer ? Les étapes dans l\'ordre', tlZero: 'Sans frais', tlFin: 'dont prêt loyer NESDA', e1: 'Accord de la commission NESDA', e1s: 'Vous présentez le projet et obtenez l\'accord', e2: 'Accord de la banque', e2s: 'La banque étudie le dossier', e3: 'Location du local et enregistrement du bail', e4: 'Registre de commerce, NIF et NIS', e4s: 'Registre ou carte d\'artisan, timbres et documents', e5: 'Ouverture du compte et dépôt de l\'apport', e5s: 'C\'est ici que vous versez votre apport', e6: 'Notaire : nantissement du matériel', e6s: 'Avant le déblocage du crédit', e7: 'Assurance', e7s: 'Avant la livraison du matériel', projT: (m, c) => `Financement du matériel : ${m} DA · coût total : ${c} DA`, da: 'DA', act: 'Activité (facultatif)', actPh: 'ex. pâtisserie, atelier aluminium, coiffure…',
  resT: 'Le financement de votre projet', totF: c => `Coût du projet : ${c} DA`, totE: 'Entrez le coût du projet pour voir le résultat',
  apport: 'De votre poche', pret: 'Prêt NESDA sans intérêt', banque: 'Prêt bancaire',
  okA: 'Votre profil semble remplir les conditions de base 👍', ageC: 'Pour créer, l\'âge demandé est en général de 18-19 à 55 ans.', ageE: 'Pour une extension, l\'âge demandé est de 20 à 58 ans.',
  ancNo: 'Une extension demande au moins 2 ans d\'activité, avec les documents comptables et fiscaux.', maxN: 'Le coût dépasse 10 millions DA, plafond de la NESDA.',
  ext: 'Pour une extension, les taux dépendent du dossier : estimation sur la base d\'un non-chômeur.', autoI: 'En autofinancement, pas de prêt, mais vous gardez l\'accompagnement NESDA (formation, conseil) et les avantages fiscaux.',
  estim: 'Taux selon les conditions NESDA 2026. Les frais de notaire, d\'huissier et administratifs sont des estimations : ils varient selon la wilaya et le cabinet. La décision finale revient à la NESDA et à la banque.',
  share: 'Partager mon résultat 📤', shareTxt: (a, n, b) => `J'ai calculé le financement NESDA de mon projet : ${a} DA de ma poche${n ? `, prêt NESDA ${n} DA` : ''}${b ? `, banque ${b} DA` : ''}. Calcule le tien en 30 secondes : ${SITE}`,
  leadT: 'Prêt à démarrer ? On vous envoie votre plan sur WhatsApp', leadS: 'Gratuit : résumé de votre financement + liste des documents + premières étapes.',

  sent: 'Bien reçu ✅ On vous contacte très vite. WhatsApp s\'ouvre pour envoyer votre message.', badTel: 'Numéro invalide (10 chiffres, ex. 0550123456)', needCout: 'Entrez d\'abord le coût du projet',
  waTxt: (o) => `Bonjour, j'ai fait la simulation :\n• Type : ${o.type}\n• Activité : ${o.act || '—'}\n• Coût : ${o.cout} DA\n• Ma part : ${o.a} DA${o.n ? ` · NESDA : ${o.n} DA` : ''}${o.b ? ` · Banque : ${o.b} DA` : ''}\n• À avoir en poche au démarrage : ${o.p} DA\n• Wilaya : ${o.w}\nJe voudrais connaître les étapes et préparer l'étude.`,
  indep: 'مشروعك est un bureau d\'études indépendant, sans lien avec la NESDA. Vos informations servent uniquement à vous recontacter.', espace: 'Espace porteur de projet'}};
let L = 'ar';
/* Frais de démarrage : réglables depuis l'admin (simConfig). Valeurs par défaut prudentes. */
let CFG = {notaireTaux: 1, notaireMin: 15000, loyerFinance: true, loyerPlafond: 500000, frais: [
  {ar: 'فتح الحساب البنكي', fr: 'Ouverture du compte bancaire', m: 5000, etape: 'compte'}, {ar: 'السجل التجاري أو بطاقة الحرفي', fr: 'Registre de commerce ou carte d\'artisan', m: 10000},
  {ar: 'تسجيل عقد الإيجار', fr: 'Enregistrement du bail', m: 10000, etape: 'loc'}, {ar: 'طوابع ووثائق إدارية', fr: 'Timbres et documents', m: 5000}]};
let MOIS = 12;
const S = {type: 'creation', statut: 'chomeur', zone: 'autre', formule: 'tri', anciennete: 'oui'};
const $ = s => document.querySelector(s), t = k => T[L][k];
const nb = n => `<bdi class="n">${fmt(n)}</bdi>`;   // un nombre isolé ; la devise suit le sens de la phrase
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, L === 'fr' ? ' ' : '.');
const cout = () => Number(($('#cout').value || '').replace(/\D/g, '')) || 0;
const store = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };
const load = k => { try { return localStorage.getItem(k); } catch { return null; } };

function setLang(l) {
  L = l; const h = document.documentElement; h.lang = l; h.dir = l === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(e => { const v = T[L][e.dataset.t]; if (typeof v === 'string') e.innerHTML = v; });
  document.querySelectorAll('[data-ph]').forEach(e => e.placeholder = T[L][e.dataset.ph]);
  document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === L));
  $('#chips').innerHTML = [1e6, 2e6, 4e6, 6e6, 10e6].map(v => `<button type="button" data-v="${v}">${fmt(v)}</button>`).join('');
  store('simLang', l); calc();
}
function sync() {
  document.querySelectorAll('.seg[data-k]').forEach(g => g.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', S[g.dataset.k] === b.dataset.v)));
  const ext = S.type === 'extension', showZone = (ext || S.statut === 'actif') && S.formule === 'tri';
  $('#qStatut').classList.toggle('hidden', ext); $('#qZone').classList.toggle('hidden', !showZone); $('#qAnc').classList.toggle('hidden', !ext);
  const n0 = 2 + (ext ? 0 : 1) + (showZone ? 1 : 0);   // renumérote les questions visibles
  document.querySelector('[data-n=zone]').textContent = ext ? 2 : 3;
  document.querySelector('[data-n=formule]').textContent = n0;
  document.querySelector('[data-n=age]').textContent = n0 + 1;
  document.querySelector('[data-n=cout]').textContent = n0 + 2;
  calc();
}
let R = null;   // dernier résultat
function calc() {
  const c = cout(), ext = S.type === 'extension', bi = S.formule !== 'tri';
  const g = S.formule === 'auto' ? [100, 0, 0] : S.formule === 'bi' ? [50, 50, 0] : GRILLE[(!ext && S.statut === 'chomeur') ? 'chomeur' : S.zone];
  $('#nBank').style.opacity = bi ? .35 : 1; $('#v2').parentElement.style.opacity = S.formule === 'auto' ? .35 : 1;
  ['p1', 'p2', 'p3'].forEach((id, i) => $('#' + id).textContent = g[i] ? g[i] + '%' : '—');
  ['b1', 'b2', 'b3'].forEach((id, i) => $('#' + id).style.width = (c ? g[i] : 0) + '%');
  const v = g.map(p => c * p / 100);
  ['v1', 'v2', 'v3'].forEach((id, i) => $('#' + id).textContent = c && g[i] ? fmt(v[i]) : '—');
  const num = id => Number(($(id).value || '').replace(/\D/g, '')) || 0;
  const loyTot = num('#loyer') * MOIS, assur = num('#assur');
  const notaire = c && S.formule !== 'auto' ? Math.max(CFG.notaireMin, c * CFG.notaireTaux / 100) : 0;
  const adm = c ? CFG.frais.reduce((a, f) => a + (Number(f.m) || 0), 0) : 0;
  const loyN = S.formule === 'tri' && CFG.loyerFinance ? Math.min(loyTot, CFG.loyerPlafond) : 0;
  const poche = c ? v[0] + notaire + adm + (loyTot - loyN) + assur : 0, projet = c + loyTot;
  $('#tot').innerHTML = c ? t('projT')(nb(c), nb(projet)) : t('totE');
  const fr = e => CFG.frais.filter(f => (f.etape || 'fisc') === e).reduce((a, f) => a + (Number(f.m) || 0), 0);
  const loyPerso = loyTot - loyN, da = L === 'fr' ? ' DA' : ' دج';
  const etapes = [['e1', 0, 'e1s'], ['e2', 0, 'e2s'], ['e3', loyPerso + fr('loc'), loyTot ? null : null], ['e4', fr('fisc'), 'e4s'], ['e5', v[0] + fr('compte'), 'e5s'], ['e6', notaire, 'e6s'], ['e7', assur, 'e7s']]
    .filter(([k, m]) => !(k === 'e7' && !m) && !(k === 'e6' && S.formule === 'auto') && !((k === 'e1' || k === 'e2') && S.formule === 'auto') && !(k === 'e2' && S.formule === 'bi'));
  const sub = k => k === 'e3' ? (loyTot ? `${t('fLoy')(MOIS)} : ${nb(loyTot)}${da}${loyN ? ` · ${t('tlFin')} : ${nb(loyN)}${da}` : ''}` : t('m0')) : t(k + 's');
  $('#frais').innerHTML = c ? `<h3>${t('tlT')}</h3><ol class="tl">` + etapes.map(([k, m]) => `<li class="${m ? 'pay' : 'zero'}"><div class="h"><span>${t(k)}</span><span>${m ? nb(m) + da : t('tlZero')}</span></div><small>${m && ['e3', 'e4', 'e5', 'e6'].includes(k) && (k !== 'e3' || fr('loc')) ? `<span class="est">${t('tlEst')}</span> ` : ''}${sub(k)}</small></li>`).join('') + '</ol>' : '';
  $('#poche').hidden = !c; $('#pocheV').innerHTML = c ? nb(poche) + da : '';
  const al = [], age = Number($('#age').value) || 0;
  if (c + loyTot > MAX) al.push(['bad', t('maxN')]);
  if (age && !ext && (age < 18 || age > 55)) al.push(['bad', t('ageC')]);
  if (age && ext && (age < 20 || age > 58)) al.push(['bad', t('ageE')]);
  if (ext && S.anciennete === 'non') al.push(['bad', t('ancNo')]);
  if (ext && !bi) al.push(['info', t('ext')]);
  if (S.formule === 'auto') al.push(['info', t('autoI')]);
  if (c && c + loyTot <= MAX && age && !al.some(a => a[0] === 'bad')) al.unshift(['ok', t('okA')]);
  $('#alerts').innerHTML = al.map(([k, m]) => `<div class="al ${k}">${m}</div>`).join('');
  R = c ? {c, a: v[0], n: v[1], b: v[2], poche, loyTot} : null;
  store('simState', JSON.stringify({S, c: $('#cout').value, age: $('#age').value, act: $('#activite').value, loyer: $('#loyer').value, assur: $('#assur').value, mois: MOIS}));
  document.querySelectorAll('#mois button').forEach(b => b.setAttribute('aria-pressed', Number(b.dataset.v) === MOIS));
}
document.querySelectorAll('.seg[data-k]').forEach(g => g.addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (b) { S[g.dataset.k] = b.dataset.v; sync(); } }));
$('#cout').addEventListener('input', e => { const n = e.target.value.replace(/\D/g, '').slice(0, 9); e.target.value = n ? fmt(n) : ''; calc(); });
$('#chips').addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (b) { $('#cout').value = fmt(b.dataset.v); calc(); } });
$('#age').addEventListener('input', calc);
['#loyer', '#assur'].forEach(id => $(id).addEventListener('input', e => { const n = e.target.value.replace(/\D/g, '').slice(0, 9); e.target.value = n ? fmt(n) : ''; calc(); }));
$('#mois').addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (b) { MOIS = Number(b.dataset.v); if (!MOIS) $('#loyer').value = ''; calc(); } }); $('#activite').addEventListener('input', calc);
document.querySelector('.langs').addEventListener('click', e => { const b = e.target.closest('button[data-l]'); if (b) setLang(b.dataset.l); });
$('#bShare').onclick = async () => {
  const txt = R ? t('shareTxt')(fmt(R.a), R.n ? fmt(R.n) : '', R.b ? fmt(R.b) : '') : SITE;
  if (navigator.share) { try { await navigator.share({text: txt}); return; } catch {} }
  window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
};
const telN = s => { let n = String(s || '').replace(/\D/g, ''); if (n.startsWith('00213')) n = '0' + n.slice(5); else if (n.startsWith('213')) n = '0' + n.slice(3); return n; };
$('#fLead').addEventListener('submit', async e => {
  e.preventDefault(); const m = $('#leadMsg'); m.innerHTML = '';
  if (!R) { m.innerHTML = `<div class="msg err">${t('needCout')}</div>`; $('#cout').focus(); return; }
  const tel = telN($('#tel').value); if (!/^0[5-7]\d{8}$/.test(tel)) { m.innerHTML = `<div class="msg err">${t('badTel')}</div>`; return; }
  const o = {p: fmt(R.poche), type: S.type === 'extension' ? t('extension') : t('creation'), act: $('#activite').value.trim(), cout: fmt(R.c), a: fmt(R.a), n: R.n ? fmt(R.n) : '', b: R.b ? fmt(R.b) : '', w: $('#wilaya').value.trim()};
  const w = window.open('', '_blank');   // ouverte tout de suite pour ne pas être bloquée
  $('#bLead').disabled = true;
  const src = new URLSearchParams(location.search).get('src') || '';
  try {
    await fetch(API, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({action: 'lead', lang: L, nom: $('#nom').value.trim(), tel, wilaya: o.w,
      activite: o.act, type: S.type, statut: S.type === 'extension' ? 'extension' : S.statut, zone: S.zone, formule: S.formule, age: $('#age').value, cout: R.c, apport: Math.round(R.a), nesda: Math.round(R.n), banque: Math.round(R.b), loyer: Math.round(R.loyTot), poche: Math.round(R.poche), source: src})});
  } catch {}
  m.innerHTML = `<div class="msg ok">${t('sent')}</div>`;
  const url = 'https://wa.me/' + WA + '?text=' + encodeURIComponent(t('waTxt')(o));
  if (w) w.location = url; else location.href = url;
  $('#bLead').disabled = false;
});
/* démarrage */
try { const st = JSON.parse(load('simState') || 'null'); if (st) { Object.assign(S, st.S || {}); $('#cout').value = st.c || ''; $('#age').value = st.age || ''; $('#activite').value = st.act || ''; $('#loyer').value = st.loyer || ''; $('#assur').value = st.assur || ''; if (st.mois !== undefined) MOIS = st.mois; } } catch {}
const ql = new URLSearchParams(location.search).get('lang');
setLang(['ar', 'fr'].includes(ql) ? ql : (load('simLang') || 'ar')); sync();
fetch(API, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({action: 'simConfig'})}).then(r => r.json()).then(j => { if (j.ok && j.cfg) { CFG = Object.assign(CFG, j.cfg); calc(); } }).catch(() => {});
</script>
