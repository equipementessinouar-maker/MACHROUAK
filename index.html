  if (e.target.id !== 'recu' || !e.target.files[0]) return; const f = e.target.files[0];
  if (f.size > 5 * 1024 * 1024) return say('#payMsg', t('tropGros'));
  say('#payMsg', t('envoiEnCours'), true);
  try { render((await call('recu', {name: f.name, mime: f.type, b64: await toB64(f)})).data); say('#payMsg', t('recuMsg'), true); } catch (er) { say('#payMsg', er.message); }
});
$('#fMail').addEventListener('submit', async e => { e.preventDefault(); $('#bMail').disabled = true;
  try { render((await call('email', {email: $('#mail').value})).data); say('#mailMsg', t('mailOk'), true); } catch (er) { say('#mailMsg', er.message); }
  $('#bMail').disabled = false; });
$('#fReq').addEventListener('submit', async e => { e.preventDefault(); $('#bReq').disabled = true;
  try { render((await call('request', {type: $('#rType').value, message: $('#rMsg').value})).data); $('#rMsg').value = ''; say('#reqMsg', t('reqOk'), true); } catch (er) { say('#reqMsg', er.message); }
  $('#bReq').disabled = false; });

/* ---------- démarrage ---------- */
const nav = (navigator.language || '').slice(0, 2);
setLang(load('mchLang') || new URLSearchParams(location.search).get('lang') || 'ar');   // arabe par défaut, quelle que soit la langue du téléphone
$('#demoBar').hidden = !DEMO;
$('#tel').value = load('mchTel') || '';
if (!load('mchTel')) onglet(true);   // nouveau visiteur : on montre directement « Nouveau compte »
if (!DEMO && load('mchTok')) { S = load('mchTok'); call('get').then(j => entrer({token: S, data: j.data})).catch(() => sortir()); }
</script></body></html>
